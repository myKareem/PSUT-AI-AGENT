<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSUT Voice Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0e1a;--surface:#111827;--border:#1e293b;
  --primary:#6366f1;--primary-glow:rgba(99,102,241,.35);
  --accent:#22d3ee;--text:#e2e8f0;--text-dim:#94a3b8;
  --danger:#ef4444;--success:#22c55e;
}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;overflow:hidden}
body::before{content:'';position:fixed;inset:0;
  background:radial-gradient(circle at 50% 30%,rgba(99,102,241,.08) 0%,transparent 60%);
  pointer-events:none;z-index:0}

.container{position:relative;z-index:1;display:flex;flex-direction:column;
  align-items:center;gap:24px;max-width:460px;width:90%}

.title{font-size:1.5rem;font-weight:700;text-align:center;letter-spacing:-.02em;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{font-size:.9rem;color:var(--text-dim);text-align:center;margin-top:-14px}

.status-bar{background:var(--surface);border:1px solid var(--border);
  border-radius:16px;padding:14px 24px;width:100%;text-align:center;
  font-size:.95rem;color:var(--text-dim);transition:all .3s;
  min-height:52px;display:flex;align-items:center;justify-content:center;gap:10px}
.status-bar.active{border-color:var(--primary);color:var(--text)}

.transcript{background:var(--surface);border:1px solid var(--border);
  border-radius:16px;padding:18px 22px;width:100%;max-height:200px;
  overflow-y:auto;font-size:.92rem;line-height:1.7;direction:rtl;
  scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.transcript:empty{display:none}
.transcript .user{color:var(--accent);margin-bottom:6px}
.transcript .bot{color:var(--text);margin-bottom:12px}
.transcript .label{font-weight:700;font-size:.8rem;opacity:.6;margin-left:6px}

/* Buttons row */
.btn-row{display:flex;gap:20px;align-items:center;justify-content:center}

.mic-btn{width:110px;height:110px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(145deg,var(--primary),#4f46e5);
  color:#fff;font-size:2.2rem;display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 0 var(--primary-glow);transition:all .3s;position:relative}
.mic-btn:hover{transform:scale(1.05);box-shadow:0 0 30px var(--primary-glow)}
.mic-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.mic-btn.listening{background:linear-gradient(145deg,var(--danger),#dc2626);
  animation:pulse-ring 1.5s ease-out infinite}
.mic-btn.speaking{background:linear-gradient(145deg,var(--success),#16a34a)}

@keyframes pulse-ring{
  0%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}
  70%{box-shadow:0 0 0 20px rgba(239,68,68,0)}
  100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}
}

.hangup-btn{width:60px;height:60px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(145deg,var(--danger),#b91c1c);
  color:#fff;font-size:1.4rem;display:none;align-items:center;justify-content:center;
  transition:all .3s}
.hangup-btn:hover{transform:scale(1.1);box-shadow:0 0 20px rgba(239,68,68,.4)}
.hangup-btn.visible{display:flex}

.interrupt-btn{background:none;border:1px solid var(--text-dim);color:var(--text-dim);
  padding:6px 18px;border-radius:20px;font-family:inherit;font-size:.8rem;
  cursor:pointer;opacity:0;pointer-events:none;transition:all .3s}
.interrupt-btn.visible{opacity:1;pointer-events:auto}
.interrupt-btn:hover{border-color:var(--danger);color:var(--danger)}

.level-bar{width:100%;max-width:260px;height:4px;background:var(--border);
  border-radius:2px;overflow:hidden;opacity:0;transition:opacity .3s}
.level-bar.visible{opacity:1}
.level-fill{height:100%;width:0%;background:var(--accent);border-radius:2px;
  transition:width 50ms}

.dots span{animation:blink 1.4s infinite both}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
</style>
</head>
<body>
<div class="container">
  <div class="title">المساعد الذكي — جامعة الأميرة سمية</div>
  <div class="subtitle">PSUT Smart Voice Assistant</div>

  <div class="status-bar" id="status">اضغط الزر للبدء</div>

  <div class="btn-row">
    <button class="hangup-btn" id="hangupBtn" onclick="doHangup()" title="إنهاء المكالمة">📞</button>
    <button class="mic-btn" id="micBtn" onclick="handleMicClick()">🎙️</button>
  </div>

  <button class="interrupt-btn" id="interruptBtn" onclick="sendInterrupt()">إيقاف الرد ⏹</button>

  <div class="level-bar" id="levelBar"><div class="level-fill" id="levelFill"></div></div>
  <div class="transcript" id="transcript"></div>
</div>

<script>
// ── State ──────────────────────────────────────────
let ws = null;
let audioCtx = null;
let micStream = null;
let scriptNode = null;
let sourceNode = null;
let analyserNode = null;
let currentSource = null; // currently playing AudioBufferSource

let isConnected = false;
let isListening = false;
let isSpeaking  = false;

// Recording
let audioBuffer = [];
let speechDetected = false;
let silenceFrames = 0;
const SILENCE_THRESHOLD = 0.012;
const SILENCE_FRAMES_NEEDED = 18; // ~550ms at 2048 samples per callback
const TARGET_SR = 16000;

// Audio playback queue
let playQueue = [];
let isPlaying = false;

// DOM
const micBtn       = document.getElementById('micBtn');
const statusEl     = document.getElementById('status');
const transcript   = document.getElementById('transcript');
const levelBar     = document.getElementById('levelBar');
const levelFill    = document.getElementById('levelFill');
const interruptBtn = document.getElementById('interruptBtn');
const hangupBtn    = document.getElementById('hangupBtn');

// ── UI helpers ─────────────────────────────────────
function setStatus(html, active) {
  statusEl.className = 'status-bar' + (active ? ' active' : '');
  statusEl.innerHTML = html;
}
function setStatusDots(text) {
  setStatus(text + ' <span class="dots"><span>.</span><span>.</span><span>.</span></span>', true);
}
function addTranscript(role, text) {
  const div = document.createElement('div');
  div.className = role;
  const label = role === 'user' ? 'أنت' : 'المساعد';
  div.innerHTML = '<span class="label">' + label + ':</span> ' + text;
  transcript.appendChild(div);
  transcript.scrollTop = transcript.scrollHeight;
}

// ── Mic button ─────────────────────────────────────
async function handleMicClick() {
  if (!isConnected) {
    await connectAndStart();
  }
}

// ── Hang up ────────────────────────────────────────
function doHangup() {
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({type: 'hangup'}));
  }
  cleanup();
  setStatus('تم إنهاء المكالمة — اضغط للبدء من جديد', false);
  micBtn.className = 'mic-btn';
  micBtn.disabled = false;
  hangupBtn.classList.remove('visible');
  interruptBtn.classList.remove('visible');
  transcript.innerHTML = '';
}

function cleanup() {
  stopListening();
  stopAllAudio();
  if (ws) { try { ws.close(); } catch(e){} ws = null; }
  isConnected = false;
  isSpeaking = false;
  playQueue = [];
}

// ── WebSocket ──────────────────────────────────────
async function connectAndStart() {
  setStatusDots('جاري الاتصال');
  micBtn.disabled = true;

  // Ensure AudioContext is ready (must be created on user gesture)
  if (!audioCtx) audioCtx = new AudioContext();
  if (audioCtx.state === 'suspended') await audioCtx.resume();

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(proto + '://' + location.host + '/ws');
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    isConnected = true;
    hangupBtn.classList.add('visible');
    console.log('[WS] Connected');
  };

  ws.onmessage = async (ev) => {
    if (ev.data instanceof ArrayBuffer) {
      playQueue.push(ev.data);
      if (!isPlaying) drainPlayQueue();
      return;
    }
    const msg = JSON.parse(ev.data);
    console.log('[WS]', msg.type, msg.text ? msg.text.slice(0,40) : '');

    switch (msg.type) {
      case 'greeting':
        setStatus('🔊 ' + msg.text, true);
        isSpeaking = true;
        micBtn.className = 'mic-btn speaking';
        break;

      case 'ready':
        isSpeaking = false;
        interruptBtn.classList.remove('visible');
        micBtn.disabled = false;
        micBtn.className = 'mic-btn listening';
        setStatus('🎤 تحدث الآن…', true);
        levelBar.classList.add('visible');
        startListening();
        break;

      case 'processing':
        setStatusDots('جاري المعالجة');
        micBtn.className = 'mic-btn';
        micBtn.disabled = true;
        levelBar.classList.remove('visible');
        break;

      case 'transcription':
        addTranscript('user', msg.text);
        setStatusDots('جاري توليد الإجابة');
        break;

      case 'sentence':
        isSpeaking = true;
        micBtn.className = 'mic-btn speaking';
        interruptBtn.classList.add('visible');
        setStatus('🔊 ' + msg.text, true);
        break;

      case 'done':
        // Will transition to 'ready' right after
        break;
    }
  };

  ws.onerror = (e) => { console.error('[WS] Error', e); };

  ws.onclose = () => {
    isConnected = false;
    hangupBtn.classList.remove('visible');
    interruptBtn.classList.remove('visible');
    setStatus('انقطع الاتصال — اضغط للإعادة', false);
    micBtn.disabled = false;
    micBtn.className = 'mic-btn';
    stopListening();
  };
}

// ── Audio playback ─────────────────────────────────
async function drainPlayQueue() {
  isPlaying = true;
  while (playQueue.length > 0) {
    const buf = playQueue.shift();
    await playWav(buf);
  }
  isPlaying = false;
}

function playWav(arrayBuffer) {
  return new Promise(async (resolve) => {
    if (!audioCtx) { resolve(); return; }
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    try {
      const decoded = await audioCtx.decodeAudioData(arrayBuffer.slice(0));
      const src = audioCtx.createBufferSource();
      src.buffer = decoded;
      src.connect(audioCtx.destination);
      currentSource = src;
      src.onended = () => { currentSource = null; resolve(); };
      src.start();
    } catch (e) {
      console.error('Playback err:', e);
      resolve();
    }
  });
}

function stopAllAudio() {
  playQueue = [];
  if (currentSource) { try { currentSource.stop(); } catch(e){} currentSource = null; }
}

// ── Mic capture + VAD ──────────────────────────────
async function startListening() {
  if (isListening) return;
  isListening = true;

  if (!micStream) {
    try {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true }
      });
    } catch(e) {
      console.error('Mic access denied:', e);
      setStatus('لم يتم السماح بالوصول للمايكروفون', false);
      return;
    }
  }
  if (!audioCtx) audioCtx = new AudioContext();
  if (audioCtx.state === 'suspended') await audioCtx.resume();

  sourceNode = audioCtx.createMediaStreamSource(micStream);
  analyserNode = audioCtx.createAnalyser();
  analyserNode.fftSize = 512;
  sourceNode.connect(analyserNode);

  scriptNode = audioCtx.createScriptProcessor(2048, 1, 1);
  sourceNode.connect(scriptNode);
  scriptNode.connect(audioCtx.destination);

  audioBuffer = [];
  speechDetected = false;
  silenceFrames = 0;

  scriptNode.onaudioprocess = (e) => {
    if (!isListening) return;
    const pcm = e.inputBuffer.getChannelData(0);

    let sum = 0;
    for (let i = 0; i < pcm.length; i++) sum += pcm[i] * pcm[i];
    const rms = Math.sqrt(sum / pcm.length);
    levelFill.style.width = Math.min(rms * 800, 100) + '%';

    if (rms > SILENCE_THRESHOLD) {
      speechDetected = true;
      silenceFrames = 0;
      audioBuffer.push(new Float32Array(pcm));
    } else if (speechDetected) {
      silenceFrames++;
      audioBuffer.push(new Float32Array(pcm));
      if (silenceFrames >= SILENCE_FRAMES_NEEDED) {
        stopListening();
        sendAudio();
      }
    }
  };
}

function stopListening() {
  isListening = false;
  levelBar.classList.remove('visible');
  if (scriptNode)  { scriptNode.disconnect();  scriptNode = null; }
  if (sourceNode)   { sourceNode.disconnect();   sourceNode = null; }
  if (analyserNode) { analyserNode.disconnect(); analyserNode = null; }
}

function sendAudio() {
  if (!audioBuffer.length || !ws || ws.readyState !== 1) return;

  // Combine chunks
  const totalLen = audioBuffer.reduce((s, c) => s + c.length, 0);
  const combined = new Float32Array(totalLen);
  let off = 0;
  for (const chunk of audioBuffer) { combined.set(chunk, off); off += chunk.length; }
  audioBuffer = [];

  // Resample to 16kHz
  const srcRate = audioCtx.sampleRate;
  const ratio = srcRate / TARGET_SR;
  const outLen = Math.round(combined.length / ratio);
  const resampled = new Float32Array(outLen);
  for (let i = 0; i < outLen; i++) {
    const idx = i * ratio;
    const lo = Math.floor(idx);
    const hi = Math.min(lo + 1, combined.length - 1);
    const f = idx - lo;
    resampled[i] = combined[lo] * (1 - f) + combined[hi] * f;
  }

  // Float32 → Int16
  const int16 = new Int16Array(resampled.length);
  for (let i = 0; i < resampled.length; i++) {
    const s = Math.max(-1, Math.min(1, resampled[i]));
    int16[i] = s < 0 ? s * 32768 : s * 32767;
  }

  ws.send(int16.buffer);
}

// ── Interrupt ──────────────────────────────────────
function sendInterrupt() {
  if (!ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({type: 'interrupt'}));
  stopAllAudio();
  isSpeaking = false;
  interruptBtn.classList.remove('visible');
  // Server will send 'ready' after it finishes current pipeline
}
</script>
</body>
</html>
